<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>단가표 만들기</title>
<style>
html,body{margin:0;height:100%;background:#f8fafc;font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#0f172a}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
#ld .sp{width:46px;height:46px;border:4px solid #dbe4ee;border-top-color:#1e3a5f;border-radius:50%;animation:s 1s linear infinite}
#ld b{font-size:18px}#ld small{color:#64748b;font-size:13px}
#ld a{color:#1d4ed8;font-weight:700}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="ld"><div class="sp"></div><b>💲 단가표 만들기</b><small id="ldMsg">매출 분석 도구의 단가표 화면을 불러오는 중…</small></div>
<script>
/* 단가표 만들기 전용 주소 (price-loader v1)
   - 매출 분석 도구(https://useran-coder.github.io/sales/) 최신 파일을 그대로 불러와 «단가표 전용 화면»(__PRICE_ONLY_V1468)으로 엽니다.
   - 같은 주소(useran-coder.github.io)라 로그인·이 PC 저장 자료가 매출 분석 도구와 같고, 서버 동기화도 같은 자료를 씁니다.
     → 여기서 고친 단가표는 매출 분석 도구 «단가표만들기»에도 그대로 반영됩니다.
   - 매출 분석 도구를 새 버전으로 올리면 이 화면도 자동으로 새 버전이 됩니다(이 파일은 바꿀 필요 없음). */
(function(){
  var SRC='/sales/';
  function fail(msg){
    var m=document.getElementById('ldMsg');
    if(m) m.innerHTML=msg+'<br><br><a href="'+SRC+'?price=1">단가표 화면 바로 열기</a> · <a href="javascript:location.reload()">다시 시도</a>';
    var sp=document.querySelector('#ld .sp'); if(sp) sp.style.display='none';
  }
  if(location.protocol==='file:'){ location.replace('https://useran-coder.github.io/price/'); return; }
  fetch(SRC+'index.html?_p='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(t){
    if(!/APP_BUILD=/.test(t)) throw new Error('매출 분석 도구 파일이 아님');
    var flag='<script>window.__PRICE_ONLY_V1468=1;window.__SALES_PATH_V1468='+JSON.stringify(SRC)+';<\/script>';
    t=t.replace(/<head([^>]*)>/i,function(m){ return m+flag; });
    t=t.replace(/<title>[^<]*<\/title>/i,'<title>단가표 만들기</title>');
    document.open(); document.write(t); document.close();
  }).catch(function(e){ fail('불러오지 못했습니다 ('+(e&&e.message||e)+').'); });
})();
</script>
</body>
</html>
