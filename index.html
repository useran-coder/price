<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>단가표 만들기</title>
<style>
html,body{margin:0;height:100%;background:#f8fafc;font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#0f172a}
</style>
</head>
<body>
<div id="pxLdV2"></div>
<script>
/* 단가표 만들기 전용 주소 (price-loader v2)
   - 매출 분석 도구(https://useran-coder.github.io/sales/) 최신 파일을 그대로 불러와 «단가표 전용 화면»(__PRICE_ONLY_V1468)으로 엽니다.
   - 같은 주소(useran-coder.github.io)라 로그인·이 PC 저장 자료가 매출 분석 도구와 같고, 서버 동기화도 같은 자료를 씁니다.
     → 여기서 고친 단가표는 매출 분석 도구 «단가표만들기»에도 그대로 반영됩니다.
   - 매출 분석 도구를 새 버전으로 올리면 이 화면도 자동으로 새 버전이 됩니다(이 파일은 바꿀 필요 없음).
   - v2 (2026-11-21) : 따로 보이던 «💲 단가표 만들기» 로딩창 대신 매출 분석 도구와 똑같은 동방파스텍 로딩창(로고·0%·단계)을 보여 주고,
     매출 분석 도구 화면이 그려지기 시작할 때까지 같은 창을 덮어 두어 로딩창이 하나로 이어지게 합니다. */
(function(){
  var SRC='/sales/';
  /* 매출 분석 도구 #bootWait 와 같은 모양 (로고 = 같은 그림 ci.gif) */
  var LD='<div id="pxLdV2" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#f8fafc;font-family:\'Pretendard\',\'Malgun Gothic\',\'Apple SD Gothic Neo\',sans-serif">'
    +'<img src="/price/ci.gif" alt="" aria-hidden="true" style="display:block;width:132px;height:132px;margin:0 auto 18px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(30,58,95,.16))">'
    +'<div style="font-size:54px;line-height:1;font-weight:900;color:#1e3a5f;letter-spacing:-.03em;font-variant-numeric:tabular-nums">0<span style="font-size:30px">%</span></div>'
    +'<div style="height:9px;width:260px;margin:16px auto 0;background:#e2e8f0;border-radius:6px;overflow:hidden"><div style="height:100%;width:0%;background:linear-gradient(90deg,#1e3a5f,#3b82f6);border-radius:6px"></div></div>'
    +'<div id="pxLdMsgV2" style="margin-top:11px;font-size:13px;font-weight:700;color:#64748b">화면을 준비하는 중입니다</div>'
    +'<div style="margin-top:14px;font-size:12px;color:#94a3b8;line-height:1.8;text-align:left">⏳ 이 PC 자료 열기<br>○ 서버 설정·단가표 받기<br>○ 최신 매출자료 확인·받기</div></div>';
  var box=document.getElementById('pxLdV2'); if(box) box.outerHTML=LD;
  function fail(msg){
    var m=document.getElementById('pxLdMsgV2');
    if(m) m.innerHTML=msg+'<br><br><a style="color:#1d4ed8" href="'+SRC+'?price=1">단가표 화면 바로 열기</a> · <a style="color:#1d4ed8" href="javascript:location.reload()">다시 시도</a>';
  }
  if(location.protocol==='file:'){ location.replace('https://useran-coder.github.io/price/'); return; }
  fetch(SRC+'index.html?_p='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(t){
    if(!/APP_BUILD=/.test(t)) throw new Error('매출 분석 도구 파일이 아님');
    var flag='<script>window.__PRICE_ONLY_V1468=1;window.__SALES_PATH_V1468='+JSON.stringify(SRC)+';<\/script>';
    t=t.replace(/<head([^>]*)>/i,function(m){ return m+flag; });
    t=t.replace(/<title>[^<]*<\/title>/i,'<title>단가표 만들기</title>');
    /* 새 화면의 머리줄이 먼저 그려져 깜빡이지 않게, 매출 분석 도구 로딩창(#bootWait)이 나올 때까지 같은 로딩창으로 덮어 둠 */
    t=t.replace(/<body([^>]*)>/i,function(m){ return m+LD; });
    var off='<script>try{var _px=document.getElementById("pxLdV2");if(_px)_px.parentNode.removeChild(_px);}catch(_e){}<\/script>';
    if(/<div id="bootWait"/.test(t)) t=t.replace(/<div id="bootWait"/,function(m){ return off+m; });
    else t=t.replace(/<\/body>/i,function(m){ return off+m; });
    document.open(); document.write(t); document.close();
  }).catch(function(e){ fail('불러오지 못했습니다 ('+(e&&e.message||e)+').'); });
})();
</script>
</body>
</html>
